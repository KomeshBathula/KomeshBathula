name: Generate GitHub Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: KomeshBathula
          outputs: |
            github-snake.svg
            github-snake-dark.svg?palette=github-dark

      - name: Push snake files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: main
          build_dir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
