name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: KomeshBathula
          template: classic
          base: achievements
          plugin_trophies: yes
          plugin_trophies_limit: 8
          filename: metrics.svg
          committer_branch: main
          committer_message: "chore: update metrics"
